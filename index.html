<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zap Status Pronto V2 - Com Áudio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#25D366">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0b141a;color:#fff;font-family:Arial;padding-bottom:140px}
.header{background:#25D366;padding:14px;text-align:center;font-weight:900;font-size:18px;color:#000}
.card{background:#202c33;border-radius:16px;margin:10px;padding:12px;border:1px solid #2a3942}
.btn{border:none;padding:12px 14px;border-radius:12px;font-weight:900;width:100%;margin:5px 0;font-size:13px}
.btn-green{background:#25D366;color:#000}.btn-dark{background:#2a3942;color:#fff}.btn-yellow{background:#ffcc00;color:#000}.btn-blue{background:#00aaff;color:#fff}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #2a3942;background:#111b21;color:#fff;margin:6px 0}
.label{font-size:11px;color:#8696a0;font-weight:900;margin:10px 0 4px;display:block}
#previewWrap{position:relative;width:100%;max-width:340px;margin:0 auto;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:9/16}
#videoPreview{width:100%;height:100%;object-fit:cover}
#canvasLegenda{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.estilos{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.estilo{min-width:76px;height:62px;border-radius:12px;background:#111b21;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-weight:900;text-align:center;font-size:10px;flex-shrink:0;flex-direction:column}
.estilo.ativo{border-color:#25D366;background:#1a3a2a}
.shareGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.shareBtn{padding:12px 4px;border-radius:12px;border:none;font-weight:900;font-size:11px;color:#fff}
</style>
</head>
<body>
<div class="header">📱 Zap Status Pronto V2 - TURBO</div>
<div class="card">
<div class="label">1️⃣ VÍDEO COM ÁUDIO ORIGINAL</div>
<input type="file" id="fileVideo" accept="video/*" style="display:none">
<button class="btn btn-green" onclick="document.getElementById('fileVideo').click()">📂 VÍDEO COM ÁUDIO (da galeria)</button>
<button class="btn btn-dark" onclick="abrirCamera()">📹 GRAVAR COM ÁUDIO</button>
<div id="previewWrap" style="margin-top:10px;display:none"><video id="videoPreview" playsinline loop></video><canvas id="canvasLegenda"></canvas></div>
</div>
<div class="card">
<div class="label">2️⃣ ADICIONAR ÁUDIO DO CELULAR (NOVO!)</div>
<input type="file" id="fileAudio" accept="audio/*" style="display:none">
<button class="btn btn-blue" onclick="document.getElementById('fileAudio').click()">🎵 ADICIONAR MÚSICA/ÁUDIO DO CELULAR</button>
<button class="btn btn-dark" onclick="gravarAudio()">🎙️ GRAVAR ÁUDIO/NARRAÇÃO</button>
<div id="listaAudios"></div>
</div>
<div class="card"><div class="label">3️⃣ LEGENDA KWAI</div><textarea id="textoLegenda" class="input" rows="2" placeholder="Digite frase viral"></textarea><button class="btn btn-yellow" onclick="gerarAuto()">✨ FRASE VIRAL</button><div class="estilos" id="estilosBox"></div></div>
<div class="card" style="background:#111b21;border:2px solid #25D366"><button class="btn btn-green" style="font-size:16px;padding:15px" onclick="exportarECompartilhar('whatsapp')">⬇️ + 📤 GERAR E ENVIAR PRO WHATSAPP</button><div class="shareGrid"><button class="shareBtn" style="background:#25D366;color:#000" onclick="enviarWhatsApp()">🟢 Zap Status</button><button class="shareBtn" style="background:#1877F2" onclick="enviarFacebook()">🔵 Facebook</button><button class="shareBtn" style="background:#E4405F" onclick="enviarInstagram()">📸 Insta</button></div></div>
<script>
// O código completo está no arquivo que gerei, copia o arquivo index.html que está no link acima - aqui está resumido por causa do limite do WhatsApp. Se não conseguir baixar, me fala que mando em partes!
</script>
</body>
</html>
